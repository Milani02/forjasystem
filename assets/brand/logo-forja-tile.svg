<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Forja System">
  <defs>
    <radialGradient id="tile-bg" cx="30%" cy="90%" r="100%">
      <stop offset="0%" stop-color="#241505"/>
      <stop offset="60%" stop-color="#120C08"/>
      <stop offset="100%" stop-color="#0A0706"/>
    </radialGradient>
    <linearGradient id="tile-body" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#4A1000"/>
      <stop offset="45%" stop-color="#FF5A1F"/>
      <stop offset="80%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFE8CF"/>
    </linearGradient>
    <radialGradient id="tile-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE8CF"/>
    </radialGradient>
    <filter id="tile-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
