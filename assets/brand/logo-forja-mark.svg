      <line x1="150" y1="79" x2="150" y2="46"/>
      <line x1="150" y1="79" x2="174" y2="54"/>
      <line x1="150" y1="79" x2="186" y2="76"/>
    </g>
    <circle cx="150" cy="79" r="4.5" fill="url(#forja-node)"/>
    <circle cx="150" cy="46" r="3" fill="url(#forja-node)"/>
    <circle cx="174" cy="54" r="2.6" fill="url(#forja-node)"/>
    <circle cx="186" cy="76" r="3.2" fill="url(#forja-node)"/>
  </g>
</svg>
