<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Forja System">
  <defs>
    <linearGradient id="forja-body" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#4A1000"/>
      <stop offset="45%" stop-color="#FF5A1F"/>
      <stop offset="80%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFE8CF"/>
    </linearGradient>
    <radialGradient id="forja-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE8CF"/>
    </radialGradient>
    <filter id="forja-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path fill="url(#forja-body)" d="M18,94 L85,79 L175,79 L175,113 L142,113 L142,152 L175,178 L85,178 L118,152 L118,113 L85,113 Z"/>
